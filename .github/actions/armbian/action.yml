name: build_armbian_action
description: Build and publish an Armbian image for a board and build type.

inputs:
  board:
    required: true
    description: The Armbian board to build
  kernel:
    required: true
    description: The Armbian kernel branch to use
  build_type:
    required: true
    description: The build type used for release naming and cache keys
  minimal:
    required: true
    description: Whether to build a minimal image
  desktop:
    required: true
    description: Whether to build a desktop image
  releases:
    required: true
    description: Space-separated Armbian releases to build
  armbian_commit_ref:
    required: false
    description: Optional Armbian commit or ref, bypassing the build.env version comparison
    default: ''
  github_token:
    required: true
    description: The GitHub token used to checkout Armbian and publish releases
  compare_file0:
    required: true
    description: The file used to persist the previous build.env comparison
  compare_file1:
    required: true
    description: The temporary build.env comparison file
  repository:
    required: false
    description: The repository where cache and releases are managed
    default: ${{ github.repository }}

runs:
  using: "composite"
  steps:
    - name: prepare workflow
      id: prepare_workflow
      shell: bash
      env:
        ARMBIAN_COMMIT_REF: ${{ inputs.armbian_commit_ref }}
        BOARD: ${{ inputs.board }}
        BUILD_TYPE: ${{ inputs.build_type }}
        SOURCE_DIR: armbian-build
      run: |
        source "$GITHUB_WORKSPACE/build.env"
        BUILD_VER="${ARMBIAN_COMMIT_REF:-$BUILD_VER}"
        printf 'build_ver=%s\n' "$BUILD_VER" >> "$GITHUB_OUTPUT"
        printf 'keymatrix=%s-%s-%s\n' "$GITHUB_JOB" "$BOARD" "$BUILD_TYPE" >> "$GITHUB_OUTPUT"
        printf 'source_dir=%s\n' "$SOURCE_DIR" >> "$GITHUB_OUTPUT"

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4

    - name: Clone Armbian Build
      uses: actions/checkout@v7
      with:
        repository: armbian/build
        ref: ${{ steps.prepare_workflow.outputs.build_ver }}
        path: ${{ steps.prepare_workflow.outputs.source_dir }}
        persist-credentials: false

    - name: cache_load
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.compare_file0 }}
        key: ${{ steps.prepare_workflow.outputs.keymatrix }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.prepare_workflow.outputs.keymatrix }}-

    - name: compare
      shell: bash
      if: ${{ inputs.armbian_commit_ref == '' }}
      id: compare
      env:
        COMPARE_FILE0: ${{ inputs.compare_file0 }}
        COMPARE_FILE1: ${{ inputs.compare_file1 }}
      run: |
        cp "$GITHUB_WORKSPACE/build.env" "$COMPARE_FILE1"

        if [ ! -e "$COMPARE_FILE0" ]; then
          echo "copy File for cache"
          cp "$COMPARE_FILE1" "$COMPARE_FILE0"
        else
          CONTENT_FILE0=$(cat "$COMPARE_FILE0")
          CONTENT_FILE1=$(cat "$COMPARE_FILE1")
          if [ "$CONTENT_FILE0" = "$CONTENT_FILE1" ]; then
            echo "Still at latest version"
            echo "latest_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not at latest version"
            cp "$COMPARE_FILE1" "$COMPARE_FILE0"
          fi
        fi

    - name: Build Image
      if: steps.compare.outputs.latest_version != 'true'
      working-directory: ${{ steps.prepare_workflow.outputs.source_dir }}
      env:
        BOARD: ${{ inputs.board }}
        KERNEL: ${{ inputs.kernel }}
        DESKTOP: ${{ inputs.desktop }}
        MINIMAL: ${{ inputs.minimal }}
        RELEASES: ${{ inputs.releases }}
      shell: bash
      run: |
        for release in $RELEASES; do
          bash ./compile.sh \
            ARTIFACT_IGNORE_CACHE=no \
            BOARD="$BOARD" \
            BRANCH="$KERNEL" \
            BUILD_DESKTOP="$DESKTOP" \
            BUILD_MINIMAL="$MINIMAL" \
            BUILD_ONLY=armbian-bsp \
            COMPRESS_OUTPUTIMAGE=xz,sha,txt \
            $([[ "$DESKTOP" = "yes" ]] && echo "DESKTOP_ENVIRONMENT=xfce DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED=mid") \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            MAINLINE_MIRROR=google \
            PREFER_DOCKER=yes \
            RELEASE="$release" \
            REWRITE_PATCHES_NEEDING_REBASE=yes \
            SHOW_DEBIAN=yes \
            UBOOT_MIRROR=github \
            USE_TORRENT=yes
        done

    - name: after prepare
      if: ${{ github.event_name != 'push' && steps.compare.outputs.latest_version != 'true' }}
      working-directory: ${{ steps.prepare_workflow.outputs.source_dir }}/output/images
      shell: bash
      run: |
        for file in *.img.*; do
          if [[ -f "$file" ]]; then
            size=$(stat -c %s "$file")
            if (( size > 1920*1024*1024 )); then
              echo "Processing $file (size: $size bytes > 1920MB)"
              split -b 1920M --numeric-suffixes=1 --suffix-length=3 "$file" "$file."
              rm "$file"
            else
              echo "$file is smaller than 1920 MB, splitting is skipped."
            fi
          fi
        done

    - name: Delete existing tag
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_OWNER_REPO: ${{ inputs.repository }}
      if: ${{ github.event_name != 'push' && steps.compare.outputs.latest_version != 'true' }}
      continue-on-error: true
      run: gh release delete "${{ inputs.board }}-${{ inputs.build_type }}" --cleanup-tag --yes --repo "$GH_OWNER_REPO"

    - name: Publish release files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GH_OWNER_REPO: ${{ inputs.repository }}
        ARMBIAN_REPO: armbian/build
        ARMBIAN_VERSION: ${{ steps.prepare_workflow.outputs.build_ver }}
        ARMBIAN_COMMIT_REF: ${{ inputs.armbian_commit_ref }}
      if: ${{ github.event_name != 'push' && steps.compare.outputs.latest_version != 'true' }}
      working-directory: ${{ steps.prepare_workflow.outputs.source_dir }}
      run: |
        if [ -z "$ARMBIAN_COMMIT_REF" ]; then
          ARMBIAN_URL_PREFIX="https://github.com/${ARMBIAN_REPO}/releases/tag"
        else
          ARMBIAN_URL_PREFIX="https://github.com/${ARMBIAN_REPO}/commit"
        fi
        ARMBIAN_VERSION_TEXT="[${ARMBIAN_VERSION}](${ARMBIAN_URL_PREFIX}/${ARMBIAN_VERSION})"
        cat > /tmp/release-notes.txt <<EOF
        ### Armbian Version
        ${ARMBIAN_VERSION_TEXT}
        EOF
        gh release create "${{ inputs.board }}-${{ inputs.build_type }}" \
          --title "Armbian ${{ inputs.build_type }} image for ${{ inputs.board }}" \
          --notes-file /tmp/release-notes.txt \
          --prerelease=false \
          --draft=false \
          --latest=true \
          --repo "$GH_OWNER_REPO" \
          $(find ./output/images/* -type f)

    - name: cache_save
      if: ${{ github.event_name != 'push' && inputs.armbian_commit_ref == '' && steps.compare.outputs.latest_version != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.compare_file0 }}
        key: ${{ steps.prepare_workflow.outputs.keymatrix }}-${{ github.run_id }}
