name: Build Armbian Image

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/armbian/**'
      - '.github/actions/clear_cache/**'
      - 'build.env'
#  schedule:
#    - cron: '02 15 */3 * 2'
  workflow_dispatch:
    inputs:
      armbian_commit_ref:
        description: 'Commit Ref from armbian/build to skip checkout release tag'
        required: false
        default: ''
      recache:
        description: 'Delete Cache before Build?'
        required: false
        options: [ 'yes', 'no' ]
        type: choice
        default: 'no'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  COMPARE_FILE0: /tmp/.armbian-env-content-0.txt
  COMPARE_FILE1: /tmp/.armbian-env-content-1.txt

jobs:
  clear_cache:
    runs-on: ubuntu-slim
    if: ${{ github.event.inputs.recache == 'yes' }}
    permissions:
      actions: write
      contents: read
    steps:
      - &clone
        name: clone
        uses: actions/checkout@v7

      - name: clear_cache
        uses: ./.github/actions/clear_cache
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository_onwer: ${{ github.repository_owner }}
          repository_name: ${{ github.event.repository.name }}
          recache: ${{ github.event.inputs.recache }}

  setup_matrix:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      board_kernel_matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - *clone

      - name: Resolve Ubuntu runners
        id: resolve_runners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UBUNTU_VERSION=$(gh api repos/actions/runner-images/contents/README.md \
            --jq '
              .content | gsub("\\s"; "") | @base64d | split("\n") as $lines |
              ([$lines[] |
                select(test("^\\| Ubuntu [0-9]+\\.[0-9]+<br>.*\\| x64 \\|.*`ubuntu-[0-9]+\\.[0-9]+`")) |
                capture("Ubuntu (?<version>[0-9]+\\.[0-9]+)").version] |
                unique |
                sort_by(split(".") | map(tonumber)) |
                last) as $version |
              if $version == null then
                error("Could not find a versioned x64 Ubuntu runner in actions/runner-images README")
              elif any($lines[];
                contains("Ubuntu \($version) Arm64") and
                contains("`ubuntu-\($version)-arm`"))
              then $version
              else error("No matching ARM runner found for ubuntu-\($version)")
              end
            ' || true)
          [ -n ${UBUNTU_VERSION} ] && HOST_X64_RUNNER="ubuntu-${UBUNTU_VERSION}"
          [ -z ${UBUNTU_VERSION} ] && HOST_X64_RUNNER="ubuntu-latest"
          [ -n ${UBUNTU_VERSION} ] && HOST_ARM_RUNNER="ubuntu-${UBUNTU_VERSION}-arm"
          [ -z ${UBUNTU_VERSION} ] && HOST_ARM_RUNNER="ubuntu-latest"
          echo "::notice::Resolved Ubuntu runners: $HOST_X64_RUNNER and $HOST_ARM_RUNNER"
          echo "HOST_X64_RUNNER=$HOST_X64_RUNNER" >> "$GITHUB_OUTPUT"
          echo "HOST_ARM_RUNNER=$HOST_ARM_RUNNER" >> "$GITHUB_OUTPUT"

      - name: Parse board_kernel_pairs
        id: parse
        shell: bash
        env:
          HOST_X64_RUNNER: ${{ steps.resolve_runners.outputs.HOST_X64_RUNNER }}
          HOST_ARM_RUNNER: ${{ steps.resolve_runners.outputs.HOST_ARM_RUNNER }}
        run: |
          source "$GITHUB_WORKSPACE/build.env"

          IFS=',' read -ra PAIRS <<< "$BOARD_KERNEL_PAIRS"
          MATRIX_JSON="["

          for i in "${!PAIRS[@]}"; do
            PAIR="${PAIRS[$i]}"
            IFS=':' read -r -a FIELDS <<< "$PAIR"
            BOARD="${FIELDS[0]}"
            KERNEL="${FIELDS[1]}"
            RUNNER="${FIELDS[2]}"

            if [ "${#FIELDS[@]}" -ne 3 ] || [ -z "$BOARD" ] || [ -z "$KERNEL" ]; then
              echo "::error::Invalid BOARD_KERNEL_PAIRS entry: $PAIR"
              exit 1
            fi

            case "$RUNNER" in
              host-x64) RUNNER="${HOST_X64_RUNNER}" ;;
              host-arm) RUNNER="${HOST_ARM_RUNNER}" ;;
              *)
                echo "::error::Invalid runner in BOARD_KERNEL_PAIRS entry: $PAIR (expected host-x64 or host-arm)"
                exit 1
                ;;
            esac

            if [ "$i" -gt 0 ]; then
              MATRIX_JSON="$MATRIX_JSON,"
            fi
            MATRIX_JSON="$MATRIX_JSON{\"board\":\"$BOARD\",\"kernel\":\"$KERNEL\",\"runner\":\"$RUNNER\"}"
          done

          MATRIX_JSON="$MATRIX_JSON]"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $MATRIX_JSON"

  build:
    name: Build Armbian (${{ matrix.build_type.type }} / ${{ matrix.board_kernel.board }} / ${{ matrix.board_kernel.kernel }})
    runs-on: ${{ matrix.board_kernel.runner }}
    if: ${{ !cancelled() && needs.clear_cache.result != 'failure' }}
    permissions:
      contents: write
    needs: [ clear_cache, setup_matrix ]
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - type: standard
            minimal: "no"
            desktop: "no"
            release: "noble resolute bookworm trixie"
          - type: minimal
            minimal: "yes"
            desktop: "no"
            release: "noble resolute bookworm trixie"
          - type: desktop
            minimal: "no"
            desktop: "yes"
            release: "resolute trixie"
        board_kernel: ${{ fromJson(needs.setup_matrix.outputs.board_kernel_matrix) }}

    steps:
      - uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: true

      - *clone

      - name: Build Armbian
        uses: ./.github/actions/armbian
        with:
          board: ${{ matrix.board_kernel.board }}
          kernel: ${{ matrix.board_kernel.kernel }}
          build_type: ${{ matrix.build_type.type }}
          minimal: ${{ matrix.build_type.minimal }}
          desktop: ${{ matrix.build_type.desktop }}
          releases: ${{ matrix.build_type.release }}
          armbian_commit_ref: ${{ inputs.armbian_commit_ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          compare_file0: ${{ env.COMPARE_FILE0 }}
          compare_file1: ${{ env.COMPARE_FILE1 }}
          repository: ${{ github.repository }}
